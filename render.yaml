services:
  - type: web
    name: tools-backend
    runtime: docker
    plan: starter
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: tools_app
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
